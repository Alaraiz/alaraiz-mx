    var p = document.body || document.documentElement;

    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

2Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:12px;background:#241f17;border-radius:12px;padding:14px 18px;margin-bottom:22px;\">\n          <img src=\"d439f38b-d180-45ca-809d-c16cb7a214b4\" alt=\"\" style=\"width:26px;height:26px;flex:none;opacity:.9;\">\n          <div style=\"font-size:13px;color:#b3aa9b;line-height:1.5;\">{{ t.reviewSendNote }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n          <button onclick=\"{{ send }}\" style=\"flex:1;min-width:200px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:999px;border:1px solid #E3A857;background:#E3A857;color:#1A1109;font-size:14.5px;letter-spacing:.02em;cursor:pointer;font-weight:600;font-family:'Space Grotesk',sans-serif;\" style-hover=\"background:#E8B86A;border-color:#E8B86A;\">{{ t.send }} →<\u002Fbutton>\n          <button onclick=\"{{ copy }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:999px;border:1px solid rgba(236,231,221,0.2);background:transparent;color:#ECE7DD;font-size:14px;cursor:pointer;font-weight:500;font-family:'Space Grotesk',sans-serif;\" style-hover=\"border-color:#E3A857;\">{{ copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showNav}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:34px;padding-top:24px;border-top:1px solid rgba(236,231,221,0.14);\">\n        <button onclick=\"{{ back }}\" style=\"background:transparent;border:none;color:#857c6f;font-size:14px;cursor:pointer;font-family:'Space Grotesk',sans-serif;letter-spacing:.02em;padding:6px 0;\" style-hover=\"color:#ECE7DD;\">← {{ t.back }}<\u002Fbutton>\n        <button onclick=\"{{ next }}\" style=\"{{ continueStyle }}\">{{ t.continue }} →<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showConsentNote }}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"text-align:right;font-size:12.5px;color:#E3A857;margin-top:12px;\">{{ t.consentNote }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{showSent}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"text-align:center;padding:30px 0;\">\n        <div style=\"width:66px;height:66px;border-radius:50%;background:#E3A857;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;\">\n          <span style=\"color:#1A1109;font-size:28px;\">✓<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:28px;margin:0 0 14px;\">{{ t.sentTitle }}<\u002Fh1>\n        <p style=\"font-family:'Hanken Grotesk',sans-serif;font-size:16.5px;color:#b3aa9b;line-height:1.6;max-width:440px;margin:0 auto 30px;\">{{ t.sentBody }}<\u002Fp>\n        <div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap;\">\n          <button onclick=\"{{ send }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;border:1px solid #E3A857;background:#E3A857;color:#1A1109;font-size:14px;cursor:pointer;font-weight:600;font-family:'Space Grotesk',sans-serif;\" style-hover=\"background:#E8B86A;border-color:#E8B86A;\">{{ t.sendAgain }}<\u002Fbutton>\n          <button onclick=\"{{ copy }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;border:1px solid rgba(236,231,221,0.2);background:transparent;color:#ECE7DD;font-size:14px;cursor:pointer;font-weight:500;font-family:'Space Grotesk',sans-serif;\" style-hover=\"border-color:#E3A857;\">{{ copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <button onclick=\"{{ goHome }}\" style=\"background:transparent;border:none;color:#857c6f;font-size:13px;cursor:pointer;margin-top:26px;text-decoration:underline;text-underline-offset:3px;font-family:'Space Grotesk',sans-serif;\" style-hover=\"color:#ECE7DD;\">{{ t.startOver }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E3A857&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.AGE = [\n      {id:'a1',en:'18–29',es:'18–29'},{id:'a2',en:'30–44',es:'30–44'},\n      {id:'a3',en:'45–59',es:'45–59'},{id:'a4',en:'60+',es:'60+'}\n    ];\n    this.TRAVEL = [\n      {id:'solo',en:'Solo',es:'Solo(a)'},{id:'partner',en:'Partner',es:'Pareja'},\n      {id:'friends',en:'Friends',es:'Amigos'},{id:'family',en:'Family',es:'Familia'},\n      {id:'other',en:'Other',es:'Otro'}\n    ];\n    this.BRING = [\n      {id:'shoes',en:'Comfortable walking shoes',es:'Zapatos cómodos'},\n      {id:'weather',en:'Weather-appropriate clothing',es:'Ropa adecuada al clima'},\n      {id:'layer',en:'Light layer',es:'Capa ligera o chamarra'},\n      {id:'water',en:'Water bottle',es:'Botella de agua'},\n      {id:'curiosity',en:'Curiosity',es:'Curiosidad'}\n    ];\n    this.EXPECT = [\n      {id:'conversation',en:'Conversation',es:'Conversaciones'},\n      {id:'exploration',en:'Exploration',es:'Exploración'},\n      {id:'perspectives',en:'Unexpected perspectives',es:'Perspectivas inesperadas'},\n      {id:'shared',en:'Shared experiences',es:'Momentos compartidos'}\n    ];\n    this.CONSENT = [\n      {id:'c1',en:'I may encounter unfamiliar people, places, ideas or food.',es:'Entiendo que puedo encontrar personas, lugares, ideas o alimentos que me resulten nuevos.'},\n      {id:'c2',en:'Some details may intentionally remain undisclosed until the day of the experience.',es:'Entiendo que algunos detalles pueden mantenerse en sorpresa hasta el día de la experiencia.'},\n      {id:'c3',en:'I have communicated relevant allergies, accessibility or health considerations.',es:'He comunicado alergias, necesidades de accesibilidad o consideraciones de salud relevantes.'},\n      {id:'c4',en:'I will be respectful to hosts, guests, communities and venues.',es:'Me comprometo a tratar con respeto a anfitriones, invitados, comunidades y espacios.'},\n      {id:'c5',en:'I understand ordinary risks associated with moving through an urban environment.',es:'Entiendo los riesgos ordinarios asociados a desplazarse por una ciudad.'},\n      {id:'c6',en:'I participate voluntarily.',es:'Participo voluntariamente.'}\n    ];\n    this.RATINGS = [\n      {id:'host',en:'Host',es:'Anfitrión'},\n      {id:'logistics',en:'Logistics',es:'Logística'},\n      {id:'content',en:'Content',es:'Contenido'},\n      {id:'pace',en:'Pace',es:'Ritmo'},\n      {id:'perspective',en:'Perspective / Angle',es:'Perspectiva / Ángulo'},\n      {id:'overall',en:'Overall Experience',es:'Experiencia General'}\n    ];\n    this.PRIORITIES = [\n      {id:'conversations',en:'Conversations',es:'Conversaciones'},\n      {id:'food',en:'Food & drink',es:'Comida y bebida'},\n      {id:'stories',en:'Perspectives & stories',es:'Perspectivas e historias'},\n      {id:'localhost',en:'Local host',es:'Anfitrión local'},\n      {id:'group',en:'Guest group',es:'Grupo de invitados'},\n      {id:'place',en:'Neighborhood or place visited',es:'Barrio o lugar visitado'}\n    ];\n    this.REFLECT = ['surprised','favorite','change','again','recommend','redesign','noticed'];\n\n    const F = {\n      en:{\n        fullName:'Full name',email:'Email',phone:'Phone / WhatsApp',cityCountry:'City & country of origin',\n        ageRange:'Age range',travelingWith:'Traveling with',visitedBefore:'Have you visited this city before?',\n        whatBrings:'What brings you here?',hopingDiscover:'What are you hoping to discover?',\n        allergies:'Allergies',dietary:'Dietary restrictions',mobility:'Mobility considerations',\n        languages:'Languages spoken',emergencyContact:'Emergency contact',discoverToday:'What are you hoping to discover today?',\n        signature:'Signature',date:'Date',bring:'What to bring',expect:'What to expect',name:'Name',expDate:'Experience date',\n        surprised:'What surprised you most?',favorite:'Your favorite moment?',change:'What would you change?',\n        again:'Would you do this again? Why?',recommend:'Would you recommend it? Why?',\n        redesign:'How would you redesign this experience if it were yours?',noticed:'What did you notice that others might have missed?'\n      },\n      es:{\n        fullName:'Nombre completo',email:'Correo electrónico',phone:'Teléfono / WhatsApp',cityCountry:'Ciudad y país de origen',\n        ageRange:'Rango de edad',travelingWith:'Viajas con',visitedBefore:'¿Has visitado esta ciudad antes?',\n        whatBrings:'¿Qué te trae por aquí?',hopingDiscover:'¿Qué esperas descubrir durante esta experiencia?',\n        allergies:'Alergias',dietary:'Restricciones alimenticias',mobility:'Consideraciones de movilidad',\n        languages:'Idiomas',emergencyContact:'Contacto de emergencia',discoverToday:'¿Qué esperas descubrir hoy?',\n        signature:'Firma',date:'Fecha',bring:'Qué traer',expect:'Qué esperar',name:'Nombre',expDate:'Fecha de la experiencia',\n        surprised:'¿Qué te sorprendió más?',favorite:'¿Cuál fue tu momento favorito?',change:'¿Qué cambiarías?',\n        again:'¿Participarías nuevamente? ¿Por qué?',recommend:'¿La recomendarías? ¿Por qué?',\n        redesign:'¿Cómo rediseñarías esta experiencia si fuera tuya?',noticed:'¿Qué notaste que otros podrían haber pasado por alto?'\n      }\n    };\n    const SEC = {\n      en:{about:'About you',relationship:'Your relationship with the city',practical:'Practical information',prep:'Before we meet',agreement:'Participation agreement',meta:'Your experience',ratings:'Ratings',priorities:'What you valued most',reflections:'Reflections'},\n      es:{about:'Sobre ti',relationship:'Tu relación con la ciudad',practical:'Información práctica',prep:'Antes de encontrarnos',agreement:'Acuerdo de participación',meta:'Tu experiencia',ratings:'Calificaciones',priorities:'Lo que más valoraste',reflections:'Reflexiones'}\n    };\n    this.STR = {\n      en:{\n        f:F.en, sec:SEC.en,\n        homeTagline:'Every RECREO begins before we meet.',\n        path1Title:'Before my experience',\n        path1Desc:'Share your profile, get ready, and sign the participation agreement.',\n        path2Title:'Share feedback',\n        path2Desc:'Tell us how it felt, looking back.',\n        privacyNote:'Nothing is stored online. When you finish, your responses open in your own email app, already addressed to RECREO.',\n        eyebrowBefore:'Before we meet', eyebrowFeedback:'Looking back',\n        stepWord:'Step', ofWord:'of',\n        profileTitle:'Your guest profile', profileHelp:'Every RECREO begins before we meet.',\n        prepTitle:'Before we meet', prepHelp:'This is not a tour. It is a carefully designed excuse to spend time differently.',\n        consentTitle:'Participation agreement', consentHelp:'Please review and check each statement.',\n        reviewTitle:'Review & send', reviewHelp:'A last look before it reaches us.',\n        ratingsTitle:'Looking back', ratingsHelp:'Please rate each category from 1 to 5.',\n        prioritiesTitle:'What you valued most', prioritiesHelp:'Order from 1 (most valued) to 6 (least valued).',\n        reflectionsTitle:'Reflections', reflectionsHelp:'Take your time. There are no wrong answers.',\n        oneRequestLabel:'One request', oneRequest:'Arrive on time. Stay present. Come curious.',\n        signaturePlaceholder:'Type your full name',\n        continue:'Continue', back:'Back', send:'Open email to send', sendAgain:'Open email again',\n        copy:'Copy my responses', copied:'Copied ✓', startOver:'Back to start',\n        consentNote:'Please confirm each statement and sign to continue.',\n        reviewSendNote:'This opens your email app with everything filled in, addressed to recreobyraiz@pm.me. Just press send. Nothing is stored online.',\n        sentTitle:'Almost there', sentBody:'Your email draft is ready. Press send in your mail app to deliver it to RECREO. Nothing was stored online.',\n        beforeEmailTitle:'Guest profile & participation agreement',\n        feedbackEmailTitle:'Experience feedback'\n      },\n      es:{\n        f:F.es, sec:SEC.es,\n        homeTagline:'Todo RECREO comienza antes de encontrarnos.',\n        path1Title:'Antes de mi experiencia',\n        path1Desc:'Comparte tu perfil, prepárate y firma el acuerdo de participación.',\n        path2Title:'Compartir comentarios',\n        path2Desc:'Cuéntanos cómo se sintió, mirando hacia atrás.',\n        privacyNote:'No se guarda nada en línea. Al terminar, tus respuestas se abren en tu propia app de correo, ya dirigidas a RECREO.',\n        eyebrowBefore:'Antes de encontrarnos', eyebrowFeedback:'Mirando hacia atrás',\n        stepWord:'Paso', ofWord:'de',\n        profileTitle:'Tu perfil de invitado', profileHelp:'Todo RECREO comienza antes de encontrarnos.',\n        prepTitle:'Antes de encontrarnos', prepHelp:'Esto no es un tour. Es una invitación a pasar el tiempo de otra manera.',\n        consentTitle:'Acuerdo de participación', consentHelp:'Revisa y marca cada afirmación.',\n        reviewTitle:'Revisar y enviar', reviewHelp:'Una última mirada antes de que llegue a nosotros.',\n        ratingsTitle:'Mirando hacia atrás', ratingsHelp:'Califica cada categoría del 1 al 5.',\n        prioritiesTitle:'Lo que más valoraste', prioritiesHelp:'Ordena del 1 (más valioso) al 6 (menos valioso).',\n        reflectionsTitle:'Reflexiones', reflectionsHelp:'Tómate tu tiempo. No hay respuestas incorrectas.',\n        oneRequestLabel:'Una petición', oneRequest:'Llega a tiempo. Permanece presente. Ven con curiosidad.',\n        signaturePlaceholder:'Escribe tu nombre completo',\n        continue:'Continuar', back:'Atrás', send:'Abrir correo para enviar', sendAgain:'Abrir correo de nuevo',\n        copy:'Copiar mis respuestas', copied:'Copiado ✓', startOver:'Volver al inicio',\n        consentNote:'Confirma cada afirmación y firma para continuar.',\n        reviewSendNote:'Esto abre tu app de correo con todo escrito, dirigido a recreobyraiz@pm.me. Solo presiona enviar. No se guarda nada en línea.',\n        sentTitle:'Ya casi', sentBody:'Tu borrador de correo está listo. Presiona enviar en tu app de correo para que llegue a RECREO. No se guardó nada en línea.',\n        beforeEmailTitle:'Perfil de invitado y acuerdo de participación',\n        feedbackEmailTitle:'Comentarios de la experiencia'\n      }\n    };\n\n    this.STEPS = { before:['profile','prep','consent','review'], feedback:['ratings','priorities','reflections','review'] };\n\n    this.state = {\n      lang: (props.defaultLang==='es'?'es':'en'),\n      screen:'home', flow:null, step:0, sent:false, copied:false,\n      data:{ date: new Date().toISOString().slice(0,10) }\n    };\n  }\n\n  pill(sel){\n    return 'display:inline-flex;align-items:center;gap:8px;padding:9px 17px;border-radius:999px;border:1px solid '+(sel?'#E3A857':'rgba(236,231,221,0.2)')+';background:'+(sel?'#E3A857':'transparent')+';color:'+(sel?'#1A1109':'#ECE7DD')+';font-size:14px;cursor:pointer;font-family:inherit;font-weight:'+(sel?'600':'400')+';transition:all .15s ease;';\n  }\n  box(sel,a){\n    return 'flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid '+(sel?a:'rgba(236,231,221,0.28)')+';background:'+(sel?a:'transparent')+';color:#1A1109;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .15s ease;';\n  }\n  rateCell(sel,a){\n    return 'flex:none;width:42px;height:42px;border-radius:10px;border:1px solid '+(sel?a:'rgba(236,231,221,0.2)')+';background:'+(sel?a:'transparent')+';color:'+(sel?'#1A1109':'#ECE7DD')+';font-size:15px;cursor:pointer;font-family:\"Space Grotesk\",sans-serif;display:flex;align-items:center;justify-content:center;font-weight:'+(sel?'600':'400')+';transition:all .15s ease;';\n  }\n\n  setLang = (e) => { const l = e.currentTarget.dataset.lang; this.setState({lang:l}); };\n  goHome = () => this.setState({screen:'home', flow:null, step:0, sent:false});\n  startBefore = () => this.setState({screen:'before', flow:'before', step:0, sent:false});\n  startFeedback = () => this.setState({screen:'feedback', flow:'feedback', step:0, sent:false});\n\n  next = () => {\n    const arr = this.STEPS[this.state.flow];\n    if(!this.canContinue()) return;\n    if(this.state.step < arr.length-1) this.setState({step:this.state.step+1, copied:false});\n  };\n  back = () => {\n    if(this.state.step>0) this.setState({step:this.state.step-1});\n    else this.goHome();\n  };\n\n  onInput = (e) => {\n    const {name,value} = e.target;\n    this.setState(s => ({ data: {...s.data, [name]: value} }));\n  };\n  onSingle = (e) => {\n    const {group,val} = e.currentTarget.dataset;\n    this.setState(s => ({ data: {...s.data, [group]: (s.data[group]===val? '' : val)} }));\n  };\n  onMulti = (e) => {\n    const {group,val} = e.currentTarget.dataset;\n    this.setState(s => {\n      const arr = Array.isArray(s.data[group]) ? s.data[group].slice() : [];\n      const i = arr.indexOf(val);\n      if(i>=0) arr.splice(i,1); else arr.push(val);\n      return { data: {...s.data, [group]: arr} };\n    });\n  };\n  onRate = (e) => {\n    const {row,val} = e.currentTarget.dataset;\n    this.setState(s => ({ data: {...s.data, ['rate_'+row]: Number(val)} }));\n  };\n  onPriority = (e) => {\n    const {row,val} = e.currentTarget.dataset;\n    this.setState(s => ({ data: {...s.data, ['prio_'+row]: Number(val)} }));\n  };\n\n  canContinue(){\n    const arr = this.STEPS[this.state.flow] || [];\n    const key = arr[this.state.step];\n    if(key==='consent'){\n      const c = this.state.data.consent || [];\n      return c.length===this.CONSENT.length && (this.state.data.signature||'').trim()!=='';\n    }\n    return true;\n  }\n\n  getSections(flow){\n    const L = this.state.lang, d = this.state.data, t = this.STR[L], f = t.f, sec = t.sec;\n    const lab = (list,id)=>{ const o=list.find(x=>x.id===id); return o?o[L]:id; };\n    const multi = (list,arr)=> (arr||[]).map(id=>lab(list,id)).join(', ');\n    if(flow==='before'){\n      const agree = this.CONSENT.filter(c=>(d.consent||[]).includes(c.id)).map(c=>({label:'✓',value:c[L]}));\n      return [\n        {title:sec.about, rows:[\n          {label:f.fullName,value:d.fullName},{label:f.email,value:d.email},\n          {label:f.phone,value:d.phone},{label:f.cityCountry,value:d.cityCountry},\n          {label:f.ageRange,value:d.ageRange?lab(this.AGE,d.ageRange):''},\n          {label:f.travelingWith,value:multi(this.TRAVEL,d.travelingWith)}\n        ]},\n        {title:sec.relationship, rows:[\n          {label:f.visitedBefore,value:d.visitedBefore},{label:f.whatBrings,value:d.whatBrings},\n          {label:f.hopingDiscover,value:d.hopingDiscover}\n        ]},\n        {title:sec.practical, rows:[\n          {label:f.allergies,value:d.allergies},{label:f.dietary,value:d.dietary},\n          {label:f.mobility,value:d.mobility},{label:f.languages,value:d.languages},\n          {label:f.emergencyContact,value:d.emergencyContact}\n        ]},\n        {title:sec.prep, rows:[\n          {label:f.bring,value:multi(this.BRING,d.bring)},\n          {label:f.expect,value:multi(this.EXPECT,d.expect)}\n        ]},\n        {title:sec.agreement, rows: agree.concat([\n          {label:f.discoverToday,value:d.discoverToday},\n          {label:f.signature,value:d.signature},{label:f.date,value:d.date}\n        ])}\n      ];\n    }\n    return [\n      {title:sec.meta, rows:[{label:f.name,value:d.fbName},{label:f.expDate,value:d.fbDate}]},\n      {title:sec.ratings, rows:this.RATINGS.map(r=>({label:r[L],value:d['rate_'+r.id]?d['rate_'+r.id]+' / 5':''}))},\n      {title:sec.priorities, rows:this.PRIORITIES.map(p=>({label:p[L],value:d['prio_'+p.id]?String(d['prio_'+p.id]):''}))},\n      {title:sec.reflections, rows:this.REFLECT.map(k=>({label:f[k],value:d[k]}))}\n    ];\n  }\n\n  buildText(flow){\n    const t = this.STR[this.state.lang];\n    const title = flow==='before'? t.beforeEmailTitle : t.feedbackEmailTitle;\n    let out = 'RECREO — '+title+'\\n\\n';\n    this.getSections(flow).forEach(s=>{\n      const rows = s.rows.filter(r=>r.value && String(r.value).trim());\n      if(!rows.length) return;\n      out += s.title.toUpperCase()+'\\n';\n      rows.forEach(r=>{ out += (r.label==='✓' ? '✓ '+r.value : r.label+': '+r.value) + '\\n'; });\n      out += '\\n';\n    });\n    return out.trim();\n  }\n\n  send = () => {\n    const flow = this.state.flow || 'before';\n    const t = this.STR[this.state.lang];\n    const body = this.buildText(flow);\n    const name = flow==='before' ? this.state.data.fullName : this.state.data.fbName;\n    const title = flow==='before'? t.beforeEmailTitle : t.feedbackEmailTitle;\n    const subject = 'RECREO — '+title + (name? (' · '+name) : '');\n    const href = 'mailto:recreobyraiz@pm.me?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);\n    window.location.href = href;\n    this.setState({sent:true});\n  };\n\n  copy = () => {\n    const body = this.buildText(this.state.flow || 'before');\n    const done = () => { this.setState({copied:true}); setTimeout(()=>this.setState({copied:false}), 2200); };\n    try {\n      navigator.clipboard.writeText(body).then(done, ()=>this._fallbackCopy(body, done));\n    } catch(_) { this._fallbackCopy(body, done); }\n  };\n  _fallbackCopy(text, done){\n    const ta = document.createElement('textarea');\n    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';\n    document.body.appendChild(ta); ta.select();\n    try { document.execCommand('copy'); } catch(_){}\n    document.body.removeChild(ta); done();\n  }\n\n  renderVals(){\n    const {lang,screen,flow,step,sent,copied,data} = this.state;\n    const accent = this.props.accent || '#E3A857';\n    const t = this.STR[lang];\n    const arr = this.STEPS[flow] || [];\n    const key = arr[step] || '';\n\n    const single = (list,group)=> list.map(o=>({id:o.id,label:o[lang],group, sel:data[group]===o.id, style:this.pill(data[group]===o.id)}));\n    const multiR = (list,group)=> list.map(o=>{ const sel=(data[group]||[]).includes(o.id); return {id:o.id,label:o[lang],group, sel, style:this.pill(sel)}; });\n    const checks = (list,group)=> list.map(o=>{ const sel=(data[group]||[]).includes(o.id); return {id:o.id,label:o[lang],group, sel, box:this.box(sel,accent)}; });\n\n    const ratingRows = this.RATINGS.map(r=>({ id:r.id, label:r[lang], opts:[1,2,3,4,5].map(n=>({row:r.id,n, sel:data['rate_'+r.id]===n, style:this.rateCell(data['rate_'+r.id]===n,accent)})) }));\n    const priorityRows = this.PRIORITIES.map(p=>({ id:p.id, label:p[lang], opts:[1,2,3,4,5,6].map(n=>({row:p.id,n, sel:data['prio_'+p.id]===n, style:this.rateCell(data['prio_'+p.id]===n,accent)})) }));\n    const reflectionFields = this.REFLECT.map(k=>({ name:k, label:t.f[k], value:data[k] }));\n\n    const titleMap = {profile:t.profileTitle,prep:t.prepTitle,consent:t.consentTitle,review:t.reviewTitle,ratings:t.ratingsTitle,priorities:t.prioritiesTitle,reflections:t.reflectionsTitle};\n    const helpMap = {profile:t.profileHelp,prep:t.prepHelp,consent:t.consentHelp,review:t.reviewHelp,ratings:t.ratingsHelp,priorities:t.prioritiesHelp,reflections:t.reflectionsHelp};\n\n    const reviewSections = (sent? [] : (key==='review'? this.getSections(flow) : [])).map(s=>({\n      title:s.title,\n      rows: s.rows.filter(r=>r.value && String(r.value).trim()).map(r=>{\n        const isCheck = r.label==='✓';\n        return { label:r.label, value:String(r.value), isCheck, isField: !isCheck };\n      })\n    })).filter(s=>s.rows.length);\n\n    const showForm = (screen==='before'||screen==='feedback') && !sent;\n\n    return {\n      t, accent, data,\n      enStyle:'background:transparent;border:none;cursor:pointer;font-family:\"Space Grotesk\",sans-serif;padding:4px 6px;font-weight:600;letter-spacing:.1em;color:'+(lang==='en'?'#ECE7DD':'#857c6f')+';',\n      esStyle:'background:transparent;border:none;cursor:pointer;font-family:\"Space Grotesk\",sans-serif;padding:4px 6px;font-weight:600;letter-spacing:.1em;color:'+(lang==='es'?'#ECE7DD':'#857c6f')+';',\n\n      showHome: screen==='home' && !sent,\n      showHeader: showForm && key!=='',\n      showProfile: showForm && key==='profile',\n      showPrep: showForm && key==='prep',\n      showConsent: showForm && key==='consent',\n      showRatings: showForm && key==='ratings',\n      showPriorities: showForm && key==='priorities',\n      showReflections: showForm && key==='reflections',\n      showReview: showForm && key==='review',\n      showNav: showForm && key!=='review' && key!=='',\n      showSent: sent,\n\n      eyebrow: flow==='before'? t.eyebrowBefore : t.eyebrowFeedback,\n      progressText: t.stepWord+' '+(step+1)+' '+t.ofWord+' '+(arr.length||1),\n      progressPct: Math.round(((step+1)/(arr.length||1))*100)+'%',\n      headerTitle: titleMap[key]||'',\n      headerHelp: helpMap[key]||'',\n\n      ageOpts: single(this.AGE,'ageRange'),\n      travelOpts: multiR(this.TRAVEL,'travelingWith'),\n      bringOpts: checks(this.BRING,'bring'),\n      expectOpts: checks(this.EXPECT,'expect'),\n      consentOpts: checks(this.CONSENT,'consent'),\n      ratingRows, priorityRows, reflectionFields, reviewSections,\n\n      continueStyle: this.canContinue()\n        ? 'display:inline-flex;align-items:center;gap:9px;padding:13px 28px;border-radius:999px;border:1px solid #E3A857;background:#E3A857;color:#1A1109;font-size:14px;letter-spacing:.02em;cursor:pointer;font-weight:600;font-family:\"Space Grotesk\",sans-serif;'\n        : 'display:inline-flex;align-items:center;gap:9px;padding:13px 28px;border-radius:999px;border:1px solid #241f17;background:#241f17;color:#857c6f;font-size:14px;letter-spacing:.02em;cursor:not-allowed;font-weight:600;font-family:\"Space Grotesk\",sans-serif;',\n      showConsentNote: key==='consent' && !this.canContinue(),\n      copyLabel: copied? t.copied : t.copy,\n\n      setLang:this.setLang, goHome:this.goHome, startBefore:this.startBefore, startFeedback:this.startFeedback,\n      next:this.next, back:this.back, onInput:this.onInput, onSingle:this.onSingle, onMulti:this.onMulti,\n      onRate:this.onRate, onPriority:this.onPriority, send:this.send, copy:this.copy\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
